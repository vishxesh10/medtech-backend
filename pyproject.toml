[project]
name = "medtech-backend"
version = "1.0.0"
description = "AI-Powered Medical Prescription Digitizer and Management Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=4.2.0",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "mongomock>=4.3.0",
    "pillow>=10.0.0",
    "pymongo>=4.8.0",
    "pyjwt>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
