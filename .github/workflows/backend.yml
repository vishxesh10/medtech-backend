name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medtech
          POSTGRES_PASSWORD: medtech
          POSTGRES_DB: medtech
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install --no-cache-dir uv

    - name: Install dependencies
      run: uv sync

    - name: Run migrations
      run: |
        source .venv/bin/activate
        alembic upgrade head
      env:
        DATABASE_URL: postgresql+psycopg://medtech:medtech@localhost:5432/medtech

    - name: Run tests
      run: |
        source .venv/bin/activate
        pytest -v
      env:
        DATABASE_URL: sqlite:///./test_prescriptions.db
        JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long!

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t medtech-backend:${{ github.sha }} .

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: github.event_name == 'push'
      run: |
        docker tag medtech-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/medtech-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/medtech-backend:latest
