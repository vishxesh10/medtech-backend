services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medtech
      POSTGRES_PASSWORD: medtech
      POSTGRES_DB: medtech
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medtech -d medtech"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://medtech:medtech@db:5432/medtech
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-string}
      GEMINI_KEY: ${GEMINI_KEY:-}
      CORS_ALLOW_ORIGINS: '["*"]'
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
